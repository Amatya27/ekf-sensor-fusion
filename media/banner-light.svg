<text x="62" y="134" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="800" fill="#1f2328">EKF Sensor Fusion</text>
<text x="64" y="176" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#59636e">Fuses wheel odometry, gyro, GPS and LiDAR landmarks</text><text x="64" y="202" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#59636e">to track a ground robot, with outlier gating.</text>
<g transform="translate(64 236)"><rect width="225" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="18" y="29" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#0d9488">30.24 → 0.30 m</text><text x="18" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">position RMSE</text></g><g transform="translate(301.0 236)"><rect width="211" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="18" y="29" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#0d9488">~100x</text><text x="18" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">less error than odometry</text></g><g transform="translate(524.2 236)"><rect width="197" height="64" rx="12" fill="#ffffff" stroke="#d0d7de"/><text x="18" y="29" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#0d9488">~30 µs</text><text x="18" y="50" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#59636e">per measurement update</text></g>
