<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="EKF Sensor Fusion: Fuses wheel odometry, gyro, GPS and LiDAR landmarks to track a ground robot, with outlier gating.">
