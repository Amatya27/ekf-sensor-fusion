<pattern id="dt" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d8e2ec"/></pattern></defs>
<rect x="1" y="1" width="1278" height="338" rx="22" fill="url(#bg)" stroke="#d0d7de"/>
